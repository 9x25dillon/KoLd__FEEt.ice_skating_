name: Ice Lab checks

on:
  pull_request:
    paths:
      - "tools/ice-lab/**"
      - "games/ice-run-godot/**"
      - ".github/workflows/ice-lab-checks.yml"
  push:
    branches: [main]
    paths:
      - "tools/ice-lab/**"
      - "games/ice-run-godot/**"
      - ".github/workflows/ice-lab-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: tools/ice-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.ts
      - run: node app/build.mjs
      - run: node replay/verify.ts test/fixtures/replay-v1.json
      - name: Verify the Godot engine bridge
        working-directory: .
        run: |
          node games/ice-run-godot/tools/prepare.mjs --engine-only
          node --test games/ice-run-godot/tests/*.test.mjs
